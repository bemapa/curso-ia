<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>IA na Palma da Mão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: uma coluna estreita tipo app de celular; trilha vertical de 5 etapas (2 aulas + 1 encontro cada) */
:root{
  --bg:#f3f6f1; --card:#ffffff; --fg:#121712; --muted:#566157; --line:#d7ded5;
  --accent:#0f9d4a; --accent-ink:#ffffff; --accent-soft:#dff5e7; --meet:#b85c00; --meet-soft:#fff0dc;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --fs:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0d0a; --card:#141a15; --fg:#eef5ee; --muted:#9fb0a1; --line:#263027;
  --accent:#39ff88; --accent-ink:#052b12; --accent-soft:#12301d; --meet:#ffb357; --meet-soft:#2e2112; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0d0a; --card:#141a15; --fg:#eef5ee; --muted:#9fb0a1; --line:#263027;
  --accent:#39ff88; --accent-ink:#052b12; --accent-soft:#12301d; --meet:#ffb357; --meet-soft:#2e2112; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
a.item,a.big{text-decoration:none}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.25rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.tools{display:flex;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:.85rem;min-height:40px}
.hero{display:flex;flex-direction:column;gap:12px}
.hero p{color:var(--muted)}
.prog{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bar{height:14px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.prog b{font-variant-numeric:tabular-nums}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border:none;border-radius:14px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem;padding:12px 18px;text-decoration:none}
.big.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.big.meet{background:var(--meet);color:#1b0f00}
/* trilha */
.etapa{display:flex;flex-direction:column;gap:10px}
.etapa-h{display:flex;align-items:baseline;gap:10px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.etapa-h span{color:var(--fg);text-transform:none;letter-spacing:0;font-size:.95rem}
.item{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:14px;color:var(--fg);min-height:72px}
.item .n{flex:0 0 48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;
  background:var(--accent-soft);color:var(--fg);font-variant-numeric:tabular-nums}
.item.done .n{background:var(--accent);color:var(--accent-ink)}
.item.encontro{background:var(--meet-soft);border-color:transparent}
.item.encontro .n{background:var(--meet);color:#1b0f00;font-size:.9rem}
.item .t{display:flex;flex-direction:column;min-width:0}
.item .t small{color:var(--muted);font-size:.8rem}
.item .t b{font-weight:600}
.item.lock{opacity:.55}
.tag{margin-left:auto;font-size:.75rem;font-weight:700;color:var(--accent);white-space:nowrap}
.encontro .tag{color:var(--meet)}
/* aula */
.back{align-self:flex-start}
.kicker{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.kicker.m{color:var(--meet)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.goal{background:var(--accent-soft);border:none}
.need{display:flex;flex-wrap:wrap;gap:8px}
.need span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
ol.steps li{display:grid;grid-template-columns:36px 1fr;gap:12px;counter-increment:s}
ol.steps li::before{content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
ol.steps li div{min-width:0}
.k{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 8px;font-weight:600;white-space:nowrap}
.ex{background:var(--bg);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:.95rem}
.ex.bad{border-left-color:var(--muted);color:var(--muted)}
.tip{background:var(--meet-soft);border:none}
.tip h3{color:var(--meet)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:6px 0;cursor:pointer}
.chk input{width:26px;height:26px;flex:0 0 26px;accent-color:var(--accent);margin-top:2px}
dl{margin:0;display:flex;flex-direction:column;gap:10px}
dt{font-weight:700}
dd{margin:0;color:var(--muted)}
.q{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:12px 14px;min-height:52px}
.opt.ok{border-color:var(--accent);background:var(--accent-soft)}
.opt.no{border-color:var(--meet);opacity:.8}
.fb{font-size:.9rem;font-weight:600}
textarea{width:100%;box-sizing:border-box;min-height:140px;font:inherit;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px}
input[type=text]{width:100%;box-sizing:border-box;font:inherit;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:52px}
.nav{display:flex;gap:10px}
.nav>*{flex:1}
.cert{border:3px solid var(--accent);border-radius:20px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:14px;background:var(--card)}
.cert .nome{font-family:var(--display);font-size:1.5rem;font-weight:800;color:var(--accent);word-break:break-word}
.foot{text-align:center;color:var(--muted);font-size:.75rem;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:12px 20px;border-radius:999px;font-weight:600;z-index:20;max-width:90vw;text-align:center}
/* login + professor */
.login{display:flex;flex-direction:column;gap:14px;margin-top:6vh}
.login label{font-weight:600;font-size:.9rem}
.err{color:var(--meet);font-weight:600;min-height:1.4em}
.prof{background:var(--meet-soft);border:none}
.prof .item{background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.v{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
ol.tl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
ol.tl li{display:grid;grid-template-columns:86px 1fr;gap:10px}
ol.tl .min{font-weight:700;color:var(--meet);font-variant-numeric:tabular-nums;font-size:.85rem;padding-top:2px}
/* vídeo animado (tela sempre escura, como um player) */
:root{--vbg:#07110b;--vfg:#eafff1;--vac:#39ff88;--vwarm:#ffb357;--vcard:#13251a}
.vid{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--vbg);color:var(--vfg);border-radius:14px;overflow:hidden;font-size:clamp(10px,3vw,15px);line-height:1.35}
@media (min-width:600px){.vid{aspect-ratio:4/3}}
.vstage{position:absolute;inset:0;display:flex;flex-direction:column;padding:4%;gap:3%;box-sizing:border-box}
.vtitle{font-family:var(--display);font-weight:800;font-size:1.45em;color:var(--vac);text-align:center;text-wrap:balance}
.vvis{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:4%}
.paused *{animation-play-state:paused!important}
.a{animation:pop .6s ease var(--d,0s) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(57,255,136,.75)}100%{box-shadow:0 0 0 .9em rgba(57,255,136,0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes slide{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.ph{height:100%;aspect-ratio:9/17;max-width:62%;background:#0f1a13;border:3px solid #2c3b31;border-radius:1.6em;padding:.45em;box-sizing:border-box;display:flex;flex-direction:column}
.ph-scr{flex:1;min-height:0;background:#f6faf7;color:#14211a;border-radius:1.15em;padding:.7em;display:flex;flex-direction:column;gap:.5em;overflow:hidden;font-size:.8em;position:relative}
.ph-head{background:#0b6b3a;color:#fff;margin:-.7em -.7em 0;padding:.6em .8em;font-weight:700}
.ph-search{border:1px solid #cfd8d2;border-radius:2em;padding:.4em .8em;background:#fff;color:#14211a}
.ty{display:inline-block;animation:type 1.1s steps(14) var(--d,0s) both}
.ph-row{display:flex;gap:.5em;align-items:center;padding:.4em;border-radius:.6em}
.ph-row b{display:block}
.ph-row small{display:block;color:#5d6b62}
.ico{width:2.3em;height:2.3em;border-radius:.6em;background:#1c2b22;flex:0 0 2.3em;display:grid;place-items:center;color:#fff;font-weight:800}
.ico.ring{border-radius:50%;background:conic-gradient(#4f7cff,#b84fff,#3fd0ff,#4f7cff)}
.ph-btn{border-radius:2em;padding:.6em;text-align:center;border:1px solid #cfd8d2;background:#fff;font-weight:600}
.hi{background:#dff5e7!important;outline:2px solid #0f9d4a;animation:pop .6s ease var(--d,0s) both,glow 1.3s ease calc(var(--d,0s) + .7s) 3}
.bub{max-width:85%;padding:.5em .7em;border-radius:1em;background:#e6ece8;align-self:flex-start}
.bub.me{align-self:flex-end;background:#0f9d4a;color:#fff}
.ph-in{margin-top:auto;display:flex;gap:.4em;align-items:center}
.ph-in .f{flex:1;border:1px solid #cfd8d2;border-radius:2em;padding:.45em .7em;color:#7a877f;background:#fff}
.dot{width:2.2em;height:2.2em;border-radius:50%;background:#1c2b22;color:#fff;display:grid;place-items:center;flex:0 0 2.2em;font-weight:700}
.pop{position:absolute;left:12%;bottom:4.2em;background:#14211a;color:#fff;border-radius:.5em;padding:.4em .9em;font-weight:700}
.vflow{display:flex;align-items:center;justify-content:center;gap:2%;width:100%}
.dot.hi{color:#0f5a2e}
.fbx{flex:1 1 0;min-width:0;overflow-wrap:anywhere;hyphens:auto;background:var(--vcard);border:2px solid var(--vac);border-radius:1em;padding:.9em .35em;text-align:center;font-weight:600;font-size:1em}
.arr{color:var(--vac);font-size:1.5em;flex:0 0 auto}
.vlist{display:flex;flex-direction:column;gap:.7em;width:min(92%,30em)}
.vli{display:flex;gap:.7em;align-items:center;background:var(--vcard);border-radius:.8em;padding:.7em 1em;font-size:1.12em}
.vli i{width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;flex:0 0 1.8em;background:var(--vac);color:#052b12}
.vli.x i{background:#ff6b5b;color:#2b0500}
.vli.w i{background:var(--vwarm);color:#2b1600}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.3em}
.vgrid span{aspect-ratio:1;border-radius:.3em;position:relative;display:grid;place-items:center;color:#fff;font-weight:800}
.vba{display:flex;align-items:center;justify-content:center;gap:3%;height:88%;width:100%}
.vcard{height:100%;max-width:42%;aspect-ratio:3/4;border-radius:1em;overflow:hidden;position:relative;background:#000}
.vcard svg{width:100%;height:100%;display:block}
.vcard b{position:absolute;left:.5em;top:.5em;background:rgba(0,0,0,.65);color:#fff;border-radius:.4em;padding:.15em .5em;font-size:.9em}
.vtl{width:94%;display:flex;flex-direction:column;gap:.7em}
.trk{display:flex;gap:.5em;align-items:center}
.trk>small{width:4.5em;flex:0 0 4.5em;color:#a8c7b3}
.lane{flex:1;display:flex;gap:.25em;height:2.6em}
.lane span{flex:1;border-radius:.35em;animation:slide .5s ease var(--d,0s) both}
.wave{flex:1;height:2em;border-radius:.35em;background:repeating-linear-gradient(90deg,var(--vac) 0 3px,transparent 3px 7px);opacity:.75;transform-origin:left;animation:grow 1.4s ease var(--d,0s) both}
.ruler{position:relative;width:92%;height:3em;background:var(--vcard);border-radius:.6em}
.zone{position:absolute;top:0;bottom:0;left:25%;width:25%;background:var(--vac);border-radius:.6em;transform-origin:left;animation:grow 1s ease var(--d,0s) both}
.ticks{display:flex;justify-content:space-between;width:92%;color:#a8c7b3;font-variant-numeric:tabular-nums}
.vbig{text-align:center;font-family:var(--display);font-weight:800;font-size:2.2em;color:var(--vac)}
.pbar{height:.8em;border-radius:1em;background:#dfe7e2;overflow:hidden}
.pbar i{display:block;height:100%;background:#0f9d4a;transform-origin:left;animation:grow 2s linear var(--d,0s) both}
.vposter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;text-align:center;padding:6%;
  background:radial-gradient(circle at 50% 40%,#123a22,var(--vbg) 70%);border:none;color:var(--vfg);width:100%;font:inherit;cursor:pointer}
.vposter .pl{width:4.5em;height:4.5em;border-radius:50%;background:var(--vac);color:#052b12;display:grid;place-items:center;font-size:1.4em}
.vposter b{font-family:var(--display);font-size:1.5em;color:var(--vac)}
.vcap{background:var(--bg);border-radius:12px;padding:12px 14px;min-height:4.8em;font-size:1rem}
.vctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vbtn{min-height:48px;min-width:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);font-weight:700}
.vbtn.play{flex:1;background:var(--accent);color:var(--accent-ink);border:none}
.vprog{height:8px;background:var(--accent-soft);border-radius:8px;overflow:hidden}
.vprog i{display:block;height:100%;width:0;background:var(--accent)}
.vtime{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.a,.hi,.ty,.lane span,.wave,.zone,.pbar i{animation:none!important}}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
const S = (k, d) => { try { const v = localStorage.getItem('ia_' + k); return v === null ? d : JSON.parse(v) } catch (e) { return d } };
const W = (k, v) => { try { localStorage.setItem('ia_' + k, JSON.stringify(v)) } catch (e) {} };

const K = t => `<span class="k">${t}</span>`;

const AULAS = [
 { t:"O celular sem medo", min:"30 min",
   goal:"Aprender a mexer no celular com segurança: tocar, arrastar, voltar, trocar de app e instalar aplicativos pela Play Store.",
   need:["Celular carregado","Internet (Wi-Fi ou dados)"],
   intro:"Antes de usar inteligência artificial, a gente precisa ficar à vontade com o celular. Não tem como estragar nada só tocando na tela. Se ficar perdido, é só voltar.",
   steps:[
    `<b>Os toques.</b> ${K("Tocar")} uma vez abre as coisas. ${K("Segurar o dedo")} mostra mais opções. ${K("Arrastar")} rola a tela para cima e para baixo. Abrir e fechar dois dedos na tela aumenta ou diminui uma foto.`,
    `<b>Os três caminhos de fuga.</b> Na parte de baixo da tela tem: ${K("◁ Voltar")}, ${K("○ Início")} (volta para a tela principal) e ${K("☰ Recentes")} (mostra os apps abertos). Se o seu celular não tem esses botões, deslize o dedo de baixo para cima.`,
    `<b>Internet.</b> Puxe o dedo do topo da tela para baixo. Aparecem os atalhos. O ícone de leque é o ${K("Wi-Fi")}. Em casa, use sempre o Wi-Fi para não gastar o pacote de dados.`,
    `<b>A loja de apps.</b> Abra a ${K("Play Store")} (triângulo colorido). Toque na lupa, digite o nome do app e toque em ${K("Instalar")}. No iPhone, a loja se chama ${K("App Store")}.`,
    `<b>Achar o app depois.</b> O app instalado aparece na tela inicial ou na gaveta de apps (deslize de baixo para cima na tela inicial). Segure o ícone e arraste para onde quiser.`
   ],
   tip:"Antes de instalar qualquer app, olhe o nome da empresa embaixo do nome do app. Tem muito app falso imitando os famosos.",
   pratica:["Abri e fechei 3 apps diferentes usando o botão Voltar","Usei o botão Recentes para trocar de um app para outro","Liguei o Wi-Fi pela barra de cima","Procurei o app “Google” na Play Store e vi se tinha botão Atualizar"],
   quiz:[{q:"Fiquei perdido numa tela estranha. O que eu faço?",o:["Desligo o celular","Toco em Voltar ou em Início","Tiro a bateria"],c:1,e:"Voltar e Início sempre te tiram de qualquer tela."},
         {q:"Onde instalo aplicativos no Android?",o:["No navegador","Na Play Store","No WhatsApp"],c:1,e:"A Play Store é a loja oficial de apps do Android."}],
   glos:[["App","Programa do celular. WhatsApp, Instagram e ChatGPT são apps."],["Ícone","O desenho que você toca para abrir um app."],["Notificação","Aviso que aparece no topo da tela."]]
 },
 { t:"Conhecendo a IA e o ChatGPT", min:"40 min",
   goal:"Entender o que é inteligência artificial, instalar o ChatGPT, criar a conta e ter a primeira conversa, digitando e falando.",
   need:["Conta do Google (o e-mail do celular)","Play Store funcionando"],
   intro:"Inteligência artificial (IA) é um programa que aprendeu lendo e vendo uma quantidade enorme de textos e imagens. Você conversa com ela como se fosse uma pessoa, e ela responde, escreve, cria imagens e até músicas. Ela é muito útil, mas às vezes erra. Pense nela como um ajudante esperto, não como um professor que sabe tudo.",
   steps:[
    `Na Play Store, procure ${K("ChatGPT")}. Confira se embaixo está escrito <b>OpenAI</b>. Toque em ${K("Instalar")}.`,
    `Abra o app e toque em ${K("Continuar com o Google")}. Escolha o seu e-mail. Pronto, a conta está criada, sem precisar inventar senha nova.`,
    `Embaixo tem a caixa de mensagem. Toque nela, escreva <i>“Oi, me explica o que você sabe fazer, de um jeito simples”</i> e toque na setinha para enviar.`,
    `Não gosta de digitar? Toque no ${K("🎤 microfone")} e fale. O que você falar vira texto.`,
    `Tem também o modo de <b>conversa por voz</b> (ícone de ondinhas ao lado da caixa de texto). Nele você conversa falando e a IA responde falando, como numa ligação.`
   ],
   tip:"Pode perguntar qualquer coisa, sem vergonha. A IA não julga. Se a resposta ficou difícil, escreva: “explica de novo como se eu tivesse 10 anos”.",
   pratica:["Instalei o ChatGPT (da OpenAI)","Entrei com a minha conta do Google","Fiz 3 perguntas digitando","Fiz 1 pergunta pelo microfone","Testei a conversa por voz"],

const d_ = d => `style="--d:${d}s"`;
const V = {
  phone:(inner,d=0)=>`<div class="ph a" ${d_(d)}><div class="ph-scr">${inner}</div></div>`,
  head:t=>`<div class="ph-head">${t}</div>`,
  search:(t,d)=>`<div class="ph-search a" ${d_(d)}>🔍 <span class="ty" ${d_(d+.4)}>${t}</span></div>`,
  row:(ico,name,by,d,hi,cls='')=>`<div class="ph-row a ${hi?'hi':''}" ${d_(d)}><span class="ico ${cls}">${ico}</span><div><b>${name}</b><small>${by}</small></div></div>`,
  btn:(t,d,hi)=>`<div class="ph-btn a ${hi?'hi':''}" ${d_(d)}>${t}</div>`,
  bub:(t,me,d)=>`<div class="bub a ${me?'me':''}" ${d_(d)}>${t}</div>`,
  input:(t,btns,d=0)=>`<div class="ph-in a" ${d_(d)}><span class="f">${t}</span>${btns}</div>`,
  dot:(t,d,hi)=>`<span class="dot ${hi?'hi':''}" ${hi?d_(d):''}>${t}</span>`,
  flow:(arr,dd=1.2)=>`<div class="vflow">${arr.map((x,i)=>(i?`<span class="arr a" ${d_(i*dd-.3)}>→</span>`:'')+`<div class="fbx a" ${d_(i*dd)}>${x}</div>`).join('')}</div>`,
  list:(arr,kind='',dd=1)=>`<div class="vlist">${arr.map((x,i)=>`<div class="vli ${kind} a" ${d_(.3+i*dd)}><i>${kind==='x'?'✕':kind==='w'?'!':'✓'}</i>${x}</div>`).join('')}</div>`,
  big:(t,sub='',d=0)=>`<div class="a" ${d_(d)} style="text-align:center"><div class="vbig">${t}</div>${sub?`<p style="margin-top:.5em;font-size:1.15em">${sub}</p>`:''}</div>`,
  grid:(hi,d=.4,nums=false)=>`<div class="vgrid">${[140,30,200,90,350,260,10,180,300].map((h,i)=>`<span class="a ${i===hi||(nums&&i<5)?'hi':''}" style="--d:${d+i*.15}s;background:hsl(${h} 55% 45%)">${nums&&i<5?i+1:''}</span>`).join('')}</div>`
};
function pic(style,bg){ // cena simples: pessoa no cenário. style: 'foto' | 'desenho'
  const s = style==='desenho' ? 'stroke="#111" stroke-width="4"' : '';
  const sky = bg==='praia' ? '#5cc8ff' : bg==='cinza' ? '#8a918c' : (style==='desenho'?'#7fd8ff':'#9cc3d8');
  const ground = bg==='praia' ? '#f3d27a' : bg==='cinza' ? '#6d736f' : (style==='desenho'?'#5bd16a':'#6f9a62');
  const skin = style==='desenho' ? '#ffcc99' : '#c99a78';
  const shirt = style==='desenho' ? '#ff4d6d' : '#7a4b5a';
  return `<svg viewBox="0 0 120 160" aria-hidden="true"><rect width="120" height="160" fill="${sky}"/>
  ${bg==='praia'?'<circle cx="95" cy="30" r="14" fill="#ffe14d"/><rect y="88" width="120" height="16" fill="#2e8bd8"/>':''}
  <rect y="100" width="120" height="60" fill="${ground}"/>
  <rect x="38" y="82" width="44" height="78" rx="16" fill="${shirt}" ${s}/>
  <circle cx="60" cy="62" r="20" fill="${skin}" ${s}/>
  ${style==='desenho'?'<circle cx="53" cy="60" r="3" fill="#111"/><circle cx="67" cy="60" r="3" fill="#111"/><path d="M52 70 Q60 77 68 70" fill="none" stroke="#111" stroke-width="3"/>':'<circle cx="53" cy="60" r="2" fill="#3b2a20"/><circle cx="67" cy="60" r="2" fill="#3b2a20"/>'}

/* ---------- sons do vídeo (gerados no próprio celular, sem arquivos) ---------- */
const SOM = (() => {
  let ctx=null, master=null, sfxBus=null, musBus=null, musTimer=null, step=0, nextT=0, on=true;
  const pend=[];
  function init(){
    if(ctx) return true;
    try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
      ctx=new AC(); master=ctx.createGain(); master.gain.value=.9; master.connect(ctx.destination);
      sfxBus=ctx.createGain(); sfxBus.gain.value=.55; sfxBus.connect(master);
      musBus=ctx.createGain(); musBus.gain.value=.16; musBus.connect(master); return true; }catch(e){ return false; }
  }
  function env(g,t,a,peak,dec){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec); }
  function osc(type,f1,f2,len,vol,bus,when=0){ const t=ctx.currentTime+when, o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f1,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+len);
    env(g,t,.01,vol,len); o.connect(g); g.connect(bus||sfxBus); o.start(t); o.stop(t+len+.05); }
  let nbuf=null;
  function noise(len,vol,f1,f2,q=1,bus,when=0,type='bandpass'){ if(!nbuf){ nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const t=ctx.currentTime+when, s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    s.buffer=nbuf; f.type=type; f.Q.value=q; f.frequency.setValueAtTime(f1,t); if(f2) f.frequency.exponentialRampToValueAtTime(f2,t+len);
    env(g,t,.01,vol,len); s.connect(f); f.connect(g); g.connect(bus||sfxBus); s.start(t); s.stop(t+len+.05); }
  const fx = {
    whoosh(){ noise(.45,.5,300,3500,1.2) },
    pop(){ osc('sine',520,980,.12,.45) },
    send(){ osc('sine',700,1400,.14,.35); noise(.15,.15,2000,6000,1) },
    receive(){ osc('sine',880,0,.09,.35); osc('sine',1320,0,.12,.3,null,.08) },
    tap(){ osc('triangle',1500,700,.06,.5); noise(.04,.25,3000,0,2) },
    type(len=1.1){ for(let k=0;k<len/.09;k++){ noise(.03,.18,2500+Math.random()*1500,0,3,null,k*.09) } },
    ding(){ osc('sine',1046,0,.6,.35); osc('sine',1568,0,.5,.18,null,.04) },
    no(){ osc('square',220,180,.16,.18); osc('square',180,140,.22,.18,null,.18) },
    warn(){ osc('triangle',660,0,.15,.35); osc('triangle',440,0,.25,.35,null,.17) },
    rise(len=1.2){ osc('sawtooth',200,900,len,.08); noise(len,.12,400,4000,.8) },
    fanfare(){ [523,659,784,1046].forEach((f,k)=>osc('triangle',f,0,.35+(k===3?.6:0),.3,null,k*.14)) }
  };
  function play(name,delay=0,arg){ if(!on||!init()) return; const id=setTimeout(()=>{ try{ fx[name](arg) }catch(e){} }, delay*1000); pend.push(id); }
  function clear(){ while(pend.length) clearTimeout(pend.pop()); }
  // trilha de fundo: batida leve e alegre (100 bpm)
  const BASS=[110,87.31,130.81,98], CH=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]];
  function sched(){
    const spb=60/100/4;
    while(nextT<ctx.currentTime+.15){
      const t=nextT-ctx.currentTime, s=step%16, bar=Math.floor(step/16)%4;
      if(s===0||s===8||s===10) { osc('sine',120,45,.22,.9,musBus,t) }
      if(s===4||s===12) noise(.12,.5,1800,0,.7,musBus,t);
      if(s%2===0) noise(.03,.22,9000,0,1,musBus,t,'highpass');
      if(s===0||s===6||s===8||s===14) osc('triangle',BASS[bar],0,.25,.5,musBus,t);
      if(s===0) CH[bar].forEach(f=>osc('sine',f,0,1.6,.12,musBus,t));
      if(s===3||s===11) osc('sine',CH[bar][2]*2,0,.12,.08,musBus,t);
      nextT+=spb; step++;
    }
  }
  return {
    get on(){return on}, set on(v){ on=v; if(!v){ clear(); this.stopMusic(); } },
    unlock(){ if(init()&&ctx.state!=='running') ctx.resume().catch(()=>{}); },
    play, clear,
    startMusic(){ if(!on||!init()||musTimer) return; nextT=ctx.currentTime+.05; step=0;
      musBus.gain.cancelScheduledValues(ctx.currentTime); musBus.gain.setValueAtTime(.16,ctx.currentTime); musTimer=setInterval(sched,50); },
    duck(v){ if(ctx) musBus.gain.setTargetAtTime(v?.07:.16,ctx.currentTime,.2) },
    stopMusic(){ if(musTimer){ clearInterval(musTimer); musTimer=null } },
    stopAll(){ clear(); this.stopMusic(); }
  };
})();
SOM.on = S('som', true);

// lê as peças animadas da cena e marca o som de cada uma no tempo certo
function sonsDaCena(st,last){
  SOM.clear(); SOM.play('whoosh',0);
  const delay=el=>{ const m=(el.getAttribute('style')||'').match(/--d:\s*([\d.]+)s/); return m?+m[1]:0 };
  st.querySelectorAll('.vvis *').forEach(el=>{
    const d=delay(el), c=el.classList;
    if(c.contains('vli')) SOM.play(c.contains('x')?'no':c.contains('w')?'warn':'ding', d+.15);
    else if(c.contains('bub')) SOM.play(c.contains('me')?'send':'receive', d+.1);
    else if(c.contains('ty')) SOM.play('type', d, 1.1);
    else if(c.contains('zone')||c.contains('wave')) SOM.play('rise', d, 1.1);
    else if(el.tagName==='I' && el.parentElement.classList.contains('pbar')) SOM.play('rise', d, 2);
    else if(c.contains('fbx')||c.contains('vcard')||c.contains('ph')) SOM.play('pop', d+.1);
    else if(el.tagName==='SPAN' && el.parentElement.classList.contains('lane') && el.style.background!=='transparent') SOM.play('pop', d+.1);
    else if(el.tagName==='SPAN' && el.parentElement.classList.contains('vgrid') && !c.contains('hi')) {}
    if(c.contains('hi')) SOM.play('tap', d+.75);
  });
  if(st.querySelector('.vvis > svg')) SOM.play('ding',.3);
  if(last) SOM.play('fanfare', 4);
}

function initVideo(n){
  const sc=VIDEOS[n]; if(!sc) return;
  const dur=sc.map(s=>Math.max(8,Math.ceil(s.cap.length/12))), total=dur.reduce((a,b)=>a+b,0);
  const $=id=>document.getElementById(id);
  let i=0,t=0,playing=false,ended=false,voz=S('voz',true);
  const vid=$('vid'),st=$('vstage');
  const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
  $('vvoz').textContent=synth?('Narração: '+(voz?'ligada':'desligada')):'Sem narração neste aparelho';
  $('vsom').textContent='Sons e música: '+(SOM.on?'ligados':'desligados');
  function speak(){try{if(!synth)return;synth.cancel();if(!voz||!playing)return;const u=new SpeechSynthesisUtterance(sc[i].cap);u.lang='pt-BR';
    const pv=synth.getVoices().find(v=>/^pt[-_]BR/i.test(v.lang))||synth.getVoices().find(v=>/^pt/i.test(v.lang));if(pv)u.voice=pv;u.rate=1.05;
    u.onstart=()=>SOM.duck(true);u.onend=()=>SOM.duck(false);synth.speak(u)}catch(e){}}
  function upd(){const before=dur.slice(0,i).reduce((a,b)=>a+b,0);$('vbar').style.width=Math.min(100,(before+t)/total*100)+'%';
    $('vscn').textContent=`Cena ${i+1} de ${sc.length}`;$('vt').textContent=fmt(before+t)+' / '+fmt(total);}
  function render(){$('vposter').hidden=true;st.innerHTML=`<div class="vtitle a">${sc[i].title}</div><div class="vvis">${sc[i].v}</div>`;$('vcap').textContent=sc[i].cap;upd();}
  function go(k){i=Math.max(0,Math.min(sc.length-1,k));t=0;ended=false;render();if(playing)sonsDaCena(st,i===sc.length-1);speak();}
  function setPlay(p){playing=p;vid.classList.toggle('paused',!p);$('vplay').textContent=p?'❚❚ Pausar':(ended?'↺ Assistir de novo':'▶ Continuar');
    if(p){SOM.unlock();SOM.startMusic();}else{SOM.stopAll();}}
  function play(){if(ended){setPlay(true);go(0);return}if(!playing){const first=!$('vposter').hidden;setPlay(true);go(first?0:i);}else{setPlay(false);try{synth&&synth.cancel()}catch(e){}}}
  $('vplay').onclick=play;$('vposter').onclick=play;
  $('vprev').onclick=()=>{if(!playing)setPlay(true);go(i-1)};
  $('vnext').onclick=()=>{if(!playing)setPlay(true);go(i+1)};
  $('vvoz').onclick=()=>{if(!synth)return;voz=!voz;W('voz',voz);$('vvoz').textContent='Narração: '+(voz?'ligada':'desligada');if(voz)speak();else{synth.cancel();SOM.duck(false)}};
  $('vsom').onclick=()=>{SOM.on=!SOM.on;W('som',SOM.on);$('vsom').textContent='Sons e música: '+(SOM.on?'ligados':'desligados');if(SOM.on&&playing){SOM.unlock();SOM.startMusic();sonsDaCena(st,i===sc.length-1)}};
  const timer=setInterval(()=>{if(!playing)return;t+=.25;if(t>=dur[i]){if(i<sc.length-1)go(i+1);else{t=dur[i];ended=true;setPlay(false);}}upd();},250);
  stopVideo=()=>{clearInterval(timer);SOM.stopAll();try{synth&&synth.cancel()}catch(e){}};
}

  <div class="box"><h2>Minhas dúvidas</h2><p style="color:var(--muted)">Escreva aqui (ou use o microfone do teclado). Fica salvo neste celular.</p>
  <label for="notas${e}" hidden>Minhas dúvidas</label><textarea id="notas${e}" placeholder="Ex: não achei o botão de baixar a imagem…">${notas.replace(/</g,'&lt;')}</textarea></div>
  <button class="big meet" id="feito">${state.meet[e]?'✓ Encontro feito':'Já tivemos este encontro'}</button>
  ${e<5?`<a class="big ghost" href="#aula-${e*2+1}">Ir para a Aula ${e*2+1} →</a>`:`<a class="big ghost" href="#certificado">Ver meu certificado →</a>`}`;
  const ta=document.getElementById('notas'+e); ta.oninput=()=>W('notas'+e,ta.value);
  document.getElementById('feito').onclick=()=>{state.meet[e]=!state.meet[e];W('meet',state.meet);toast(state.meet[e]?'Encontro marcado como feito. Próxima etapa liberada!':'Desmarcado');encontro(e)};
}

function certificado(){
  const d=nDone(), nome=S('nome','');
  const hoje=new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
  app.innerHTML=`${topbar(1)}
  ${d<total?`<div class="box tip"><h3>Faltam ${total-d} aulas</h3><p>O certificado completa quando você terminar as 10 aulas.</p></div>`:''}
  <div class="box"><label for="nome"><b>Seu nome no certificado</b></label><input type="text" id="nome" value="${nome.replace(/"/g,'&quot;')}" placeholder="Digite seu nome"></div>
  <div class="cert"><div class="kicker">Certificado de conclusão</div><h2>IA na Palma da Mão</h2>
  <p>Certificamos que</p><div class="nome" id="cn">${nome||'Seu nome aqui'}</div>
  <p>${d<total?'está fazendo':'concluiu'} o curso de Inteligência Artificial no celular, com ${d} de ${total} aulas e ${Object.values(state.meet).filter(Boolean).length} encontros, aprendendo a criar textos, imagens, músicas e vídeos com IA.</p>
  <p style="color:var(--muted)">${hoje} · Professor Patrick</p></div>
  <p style="color:var(--muted);text-align:center;font-size:.9rem">Tire um print desta tela para guardar.</p>`;
  const i=document.getElementById('nome'); i.oninput=()=>{W('nome',i.value);document.getElementById('cn').textContent=i.value||'Seu nome aqui'};
}

function route(){
  stopVideo(); stopVideo=()=>{};
  const h=location.hash.slice(1);
  let m;
  if(!role()) { login(); window.scrollTo(0,0); return; }
  if((m=h.match(/^roteiro-(\d+)$/)) && isProf()) roteiro(+m[1]);
  else if(h==='precos' && isProf()) precos();
  else if((m=h.match(/^aula-(\d+)$/))) aula(+m[1]);
  else if((m=h.match(/^encontro-(\d+)$/))) encontro(+m[1]);
  else if(h==='certificado') certificado();
  else home();
  const fs=document.getElementById('fs'); if(fs) fs.onclick=()=>{const v=S('fs',18)>=22?18:S('fs',18)+2;W('fs',v);setFs();toast('Tamanho da letra: '+(v===18?'normal':v===20?'grande':'maior'))};
  const sa=document.getElementById('sair'); if(sa) sa.onclick=()=>{mem.role=null;try{localStorage.removeItem('ia_role')}catch(e){}location.hash='';route();};
  window.scrollTo(0,0);
}
function setFs(){document.documentElement.style.setProperty('--fs',S('fs',18)+'px')}
setFs();
window.addEventListener('hashchange',route);
route();
</script>

</body>
</html>
